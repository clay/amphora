name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # to assume the AWS role without stored keys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build the site
        working-directory: website
        run: |
          npm install --no-audit --no-fund
          npm run build
      # Needs the repository variable DOCS_AWS_ROLE: an IAM role that trusts this
      # repository through GitHub's OIDC provider and may write the docs bucket
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DOCS_AWS_ROLE }}
          aws-region: us-east-1
      - name: Upload to the docs bucket
        env:
          PROJECT: ${{ github.event.repository.name }}
        run: aws s3 sync --delete --acl public-read "website/build/$PROJECT/" "s3://docs.clayplatform.io/$PROJECT/"
