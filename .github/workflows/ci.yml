name: CI

on:
  pull_request:
  push:
    branches: [master]
  # lets the release workflow run the same checks before it publishes
  workflow_call:

permissions:
  contents: read

# a newer push to a pull request replaces the run still going for the old one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # .nvmrc is the one place the Node version is set (26.12.1: the first 26.x
      # with the October 2026 security fixes), shared with local development
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
