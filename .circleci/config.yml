version: 2.1

references:
  filter_all: &filter_all
    filters:
      branches:
        only: /.*/
      tags:
        only: /.*/

  filter_stg: &filter_head
    filters:
      branches:
        only: master
      tags:
        only: stg

  filter_prd: &filter_release
    filters:
      branches:
        ignore: /.*/
      tags:
        only: /^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$/

jobs:

  test:
    parameters:
      node-version:
        type: string
    docker:
      - image: cimg/node:<< parameters.node-version >>
      - image: cimg/redis:7.2
    environment:
      CLAY_COLLAB_TEST_REDIS: redis://localhost:6379
    working_directory: ~/src
    steps:
      - checkout
      - restore_cache:
          keys:
            - v4-npm-{{ checksum "package-lock.json" }}
            - v4-npm-
      - run: npm ci
      - save_cache:
          key: v4-npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm test

  deploy_docs:
    docker:
      - image: cimg/node:14.21
    working_directory: ~/src
    steps:
      - checkout
      - restore_cache:
          key: v3-website-dependencies-{{ checksum "website/package.json" }}
      - run:
          name: Build
          command: |
            sudo apt-get update
            sudo apt-get -y install awscli
            bash ./.circleci/scripts/deploy-docs.sh
      - save_cache:
          key: v3-website-dependencies-{{ checksum "website/package.json" }}
          paths:
            - website/node_modules

  deploy_package:
    docker:
      - image: cimg/node:24.21
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v4-npm-{{ checksum "package-lock.json" }}
            - v4-npm-
      - run: npm ci
      - run: |
          echo "$NPMRC" > ~/.npmrc
          chmod 600 ~/.npmrc
          if [[ "$CIRCLE_TAG" = *-* ]]; then
            npm publish --tag=prerelease
          else
            npm publish
          fi

workflows:
  test:
    jobs:
      - test:
          <<: *filter_all
          name: test_node20
          node-version: "20.20"
      - test:
          <<: *filter_all
          name: test_node22
          node-version: "22.23"
      - test:
          <<: *filter_all
          name: test_node24
          node-version: "24.21"
      - deploy_docs:
          <<: *filter_head
          context:
            - Documentation
          requires:
            - test_node20
            - test_node22
            - test_node24
      - deploy_package:
          <<: *filter_release
          context:
            - npm-publish
          requires:
            - test_node20
            - test_node22
            - test_node24
